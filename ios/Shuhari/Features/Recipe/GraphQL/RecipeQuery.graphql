fragment OvenProfileFields on OvenProfile {
  program
  temperature
  duration
  core
}

fragment VersionContentFields on VersionContent {
  __typename
  ... on DishContent {
    ingredients {
      name
      quantity
    }
    dishSteps: steps
    oven {
      ...OvenProfileFields
    }
  }
  ... on ThermomixContent {
    ingredients {
      name
      quantity
    }
    thermomixSteps: steps {
      text
      settings {
        time
        temperature
        speed
        reverse
      }
    }
    oven {
      ...OvenProfileFields
    }
  }
  ... on CoffeeContent {
    beans {
      name
      country
      producer
      roastedOn
      dose
    }
    water {
      kind
      amount
      temperature
    }
    extraction {
      grind
      time
      yield
    }
    milk {
      kind
      amount
      temperature
    }
    gear {
      machine
      grinder
    }
  }
}

fragment VersionFields on Version {
  number
  restDays
  basedOn
  change
  why
  originKind
  originDetail
  content {
    ...VersionContentFields
  }
  tips
  recipeId
  rating
  remarks
  executedAt
  tried
  toTest
  photoUrl
  createdAt
  updatedAt
}

query Recipe($id: RecipeId!) {
  recipe(id: $id) {
    id
    title
    type
    category
    method
    favorite
    warnings
    bestRating
    versionToOpen {
      ...VersionFields
    }
    versions {
      ...VersionFields
    }
  }
}
