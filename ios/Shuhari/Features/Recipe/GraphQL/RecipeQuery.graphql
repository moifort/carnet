fragment OvenProfileFields on OvenProfile {
  program
  assisted
  temperature
  duration
  core
}

# A recipe this one is made of. Resolution stops here: what THAT recipe is made of
# is not read, so a sheet never unfolds a second level.
fragment LinkedRecipeFields on Recipe {
  id
  title
  bestRating
  versionToOpen {
    number
    content {
      __typename
      ... on DishContent {
        ingredients {
          name
          quantity
        }
      }
      ... on ThermomixContent {
        ingredients {
          name
          quantity
        }
      }
    }
  }
}

fragment VersionContentFields on VersionContent {
  __typename
  ... on DishContent {
    ingredients {
      name
      quantity
    }
    dishSteps: steps
    oven {
      ...OvenProfileFields
    }
  }
  ... on ThermomixContent {
    ingredients {
      name
      quantity
    }
    thermomixSteps: steps {
      text
      settings {
        time
        temperature
        speed
        reverse
      }
    }
    oven {
      ...OvenProfileFields
    }
  }
  ... on CoffeeContent {
    beans {
      name
      country
      producer
      roast
      roastedOn
      dose
    }
    water {
      kind
      amount
      temperature
    }
    extraction {
      grind
      time
      yield
    }
    milk {
      kind
      amount
      temperature
    }
    gear {
      machine
      grinder
    }
  }
}

fragment VersionFields on Version {
  number
  restDays
  basedOn
  change
  why
  originKind
  originDetail
  content {
    ...VersionContentFields
  }
  tips
  warnings
  favorite
  recipeId
  rating
  remarks
  executedAt
  tried
  toTest
  photoUrl
  createdAt
  updatedAt
}

query Recipe($id: RecipeId!) {
  recipe(id: $id) {
    id
    title
    type
    category
    method
    favorite
    bestRating
    components {
      scale
      recipe {
        ...LinkedRecipeFields
      }
    }
    usedBy {
      id
      title
      bestRating
    }
    versionToOpen {
      ...VersionFields
    }
    versions {
      ...VersionFields
    }
  }
}
