fragment OvenProfileFields on OvenProfile {
  program
  assisted
  temperature
  duration
  core
}

# The recipe an ingredient line IS. Resolution stops here: this component's own
# ingredients are read as plain lines, never unfolded one level further.
fragment ComponentFields on Recipe {
  id
  title
  bestRating
  versionToOpen {
    number
    content {
      __typename
      ... on DishContent {
        ingredients {
          name
          quantity
        }
        dishSteps: steps
      }
      ... on ThermomixContent {
        ingredients {
          name
          quantity
        }
        thermomixSteps: steps {
          text
        }
      }
    }
  }
}

fragment VersionContentFields on VersionContent {
  __typename
  ... on DishContent {
    ingredients {
      name
      quantity
      component {
        ...ComponentFields
      }
    }
    dishSteps: steps
    oven {
      ...OvenProfileFields
    }
  }
  ... on ThermomixContent {
    ingredients {
      name
      quantity
      component {
        ...ComponentFields
      }
    }
    thermomixSteps: steps {
      text
      settings {
        time
        temperature
        speed
        reverse
      }
    }
    oven {
      ...OvenProfileFields
    }
  }
  ... on CoffeeContent {
    beans {
      name
      country
      producer
      roast
      roastedOn
      dose
    }
    water {
      kind
      amount
      temperature
    }
    extraction {
      grind
      time
      yield
    }
    milk {
      kind
      amount
      temperature
    }
    gear {
      machine
      grinder
    }
  }
}

fragment VersionFields on Version {
  number
  restDays
  basedOn
  change
  why
  originKind
  originDetail
  content {
    ...VersionContentFields
  }
  tips
  warnings
  favorite
  recipeId
  rating
  remarks
  executedAt
  tried
  toTest
  photoUrl
  createdAt
  updatedAt
}

query Recipe($id: RecipeId!) {
  recipe(id: $id) {
    id
    title
    type
    category
    method
    favorite
    bestRating
    versionToOpen {
      ...VersionFields
    }
    versions {
      ...VersionFields
    }
  }
}
