mutation AnalyzeImport($photos: [String!]!, $url: String, $text: String) {
  analyzeImport(photos: $photos, url: $url, text: $text) {
    title
    type
    category
    method
    sourceLabel
    ingredients {
      name
      quantity
    }
    coffee {
      beans {
        name
        country
        producer
        roastedOn
        dose
      }
      water {
        kind
        amount
        temperature
      }
      extraction {
        grind
        time
        yield
      }
      milk {
        kind
        amount
        temperature
      }
      gear {
        machine
        grinder
      }
    }
    steps {
      text
      thermomix {
        time
        temperature
        speed
        reverse
      }
      coffee {
        grind
        water
        temperature
        time
        yield
      }
    }
    tips
  }
}

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    id
  }
}
