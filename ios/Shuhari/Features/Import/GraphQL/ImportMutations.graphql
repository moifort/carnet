fragment CoffeeParametersFields on ImportCoffeeParameters {
  beans {
    name
    country
    producer
    roast
    roastedOn
    dose
  }
  water {
    kind
    amount
    temperature
  }
  extraction {
    grind
    time
    yield
  }
  milk {
    kind
    amount
    temperature
  }
  gear {
    machine
    grinder
  }
}

mutation AnalyzeCoffeeImport($photos: [String!]!, $url: String, $text: String) {
  analyzeCoffeeImport(photos: $photos, url: $url, text: $text) {
    title
    method
    sourceLabel
    parameters {
      ...CoffeeParametersFields
    }
    tips
  }
}

mutation AnalyzeCookingImport($photos: [String!]!, $url: String, $text: String) {
  analyzeCookingImport(photos: $photos, url: $url, text: $text) {
    title
    type
    category
    sourceLabel
    ingredients {
      name
      quantity
    }
    steps {
      text
      thermomix {
        time
        temperature
        speed
        reverse
      }
    }
    tips
  }
}

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    id
  }
}
