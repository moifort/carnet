query Oven {
  oven {
    reachable
    remoteControlEnabled
    settings {
      program
      assisted
      temperature
      duration
      core
    }
    running {
      remaining
    }
  }
}

mutation StartOven($recipeId: RecipeId!, $version: VersionNumber!) {
  startOven(recipeId: $recipeId, version: $version) {
    reachable
    remoteControlEnabled
    settings {
      program
      assisted
      temperature
      duration
      core
    }
    running {
      remaining
    }
  }
}
