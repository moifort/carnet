"""
What you get back after accepting an AI suggestion, e.g. the new `v3` added to the chain
"""
type AcceptProposalResult {
  """The number of the version that was just created, e.g. `3`"""
  createdVersion: VersionNumber

  """
  The recipe, now with the accepted version added to its chain, e.g. `"Grandma’s lasagna"` now up to `v3`
  """
  recipe: Recipe!
}

"""
One of the oven’s own assisted-cooking programmes, as the appliance names it, e.g. `"ASSIST_QUICHEANDTARTETHIN"`. Opaque: copied off the oven and handed back to it, never parsed. Paired with `OvenProgram.ASSISTED`.
"""
scalar AssistedProgram

"""
How a coffee is brewed. Detected once at import, shared by every version, and the axis the coffee tab groups and sorts on — the counterpart of `DishCategory` for cooking. Present on a `COFFEE` recipe and on no other.
"""
enum BrewMethod {
  """An AeroPress, brewed under hand pressure"""
  AEROPRESS

  """An espresso lengthened with hot water"""
  AMERICANO

  """An espresso with steamed and foamed milk"""
  CAPPUCCINO

  """A Chemex pour-over, on its thick paper filter"""
  CHEMEX

  """A long cold-water extraction"""
  COLD_BREW

  """A filter machine, e.g. a Moccamaster"""
  DRIP

  """A shot pulled on an espresso machine"""
  ESPRESSO

  """An espresso with steamed microfoam milk"""
  FLAT_WHITE

  """A French press, full immersion"""
  FRENCH_PRESS

  """An espresso with a large share of steamed milk"""
  LATTE

  """A stovetop pot, e.g. a Bialetti"""
  MOKA

  """
  Any other way of brewing — where a coffee lands when none of the above fits
  """
  OTHER

  """A cone pour-over, e.g. a Hario V60"""
  V60
}

"""
One release in the app’s "What’s new" list — the changes shipped in a given version of the app, e.g. `"1.2"` with "Faster recipe imports"
"""
type ChangelogEntry {
  """
  When that version was released, e.g. `"2026-07-18T00:00:00.000Z"` (`null` for a release not yet dated)
  """
  date: DateTime

  """
  The list of changes in this release, one line each, ready to show to the user, e.g. `"Faster recipe imports"` then `"Fixed a crash when exporting"`
  """
  notes: [String!]!

  """The app version these notes are for, e.g. `"1.2"`"""
  version: String!
}

