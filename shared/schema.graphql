type Mutation {
  """
  Accept a proposal (optionally after editing it). It becomes the next version in the chain. Coming from a cook (requestProposal), it lands on your to-cook list — nobody has made it — and the attempt you just gave (rating, remarks, photo) is recorded on the version you cooked (`basedOn`), which stops owing a try. Coming from an improvement (requestImprovement), it lands there too and nothing is recorded. Coming from a change you already made (requestChange, `cooked: true`), it is saved as already cooked, the attempt is recorded ON IT, and `basedOn` is left untouched.
  
  ```graphql
  acceptProposal(recipeId: "9f1c-a3b2", proposal: {
    basedOn: 2
    changeSummary: "Less sugar"
    rationale: "You noted it was too sweet"
    rating: 3
    remarks: "Still a touch too sweet"
    content: { dish: {
      ingredients: [{ name: "Sugar", quantity: "80 g" }]
      steps: ["Rest the dough for 2 h", "Bake at 180°C"]
    } }
  }) {
    createdVersion
  }
  ```
  """
  acceptProposal(
    """The full suggested version to save (with any edits you made)"""
    proposal: ProposalInput!

    """The recipe being iterated on, e.g. the id of `"Grandma’s lasagna"`"""
    recipeId: RecipeId!
  ): AcceptProposalResult!

  """
  Analyze an import source (photos, a URL or raw text) into a structured coffee preview: its brew method and its parameters, never an ingredient list nor steps. Use it for the coffee tab; anything cooked goes through `analyzeCookingImport`. `photos` and `text` may be sent TOGETHER — the bag plus what the cook typed to complete it, read as one source; a `url` stands alone. Results are cached server-side by SHA-256. Spends one import of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up; importing from a URL is a Premium feature and answers `PREMIUM_REQUIRED` otherwise.
  """
  analyzeCoffeeImport(
    """
    Base64 JPEGs (no data-URL prefix), up to 6 — `[]` when importing from a URL or text alone
    """
    photos: [String!]! = []

    """Raw text, on its own or alongside `photos` to complete what they show"""
    text: String

    """A web page to read — never combined with the rest"""
    url: String
  ): CoffeeImportAnalysis!

  """
  Analyze an import source (photos, a URL or raw text) into a structured recipe preview: a dish or a Thermomix recipe, with its ingredients and its steps. Use it for the notebook tab; a brewed coffee goes through `analyzeCoffeeImport` and is never answered here. `photos` and `text` may be sent TOGETHER — the pages of a book plus what the cook typed to complete them, read as one recipe; a `url` stands alone. Results are cached server-side by SHA-256. Spends one import of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up; importing from a URL is a Premium feature and answers `PREMIUM_REQUIRED` otherwise.
  """
  analyzeCookingImport(
    """
    Base64 JPEGs (no data-URL prefix), up to 6 — `[]` when importing from a URL or text alone
    """
    photos: [String!]! = []

    """
    Raw recipe text, on its own or alongside `photos` to complete what they show
    """
    text: String

    """A recipe web page to read — never combined with the rest"""
    url: String
  ): CookingImportAnalysis!

  """
  Copy one version into a recipe of its own — the variant that has drifted too far to be one more iteration of this recipe. The new recipe keeps the type, the course or brew method and the cautions of the one copied, and its `v1` carries that version’s content, tips and attempt outcome (rating, remarks). It is a detached copy, not a fork: nothing links the two lineages, the `v1` iterates on nothing, and where it came from survives only as its `originDetail` (`"Grandma’s lasagna v3"`). The recipe copied is left untouched. Returns the new recipe.
  
  ```graphql
  copyVersion(recipeId: "9f1c-a3b2", number: 3, title: "Nonna’s lasagna") {
    id
    versionToOpen { number }
  }
  ```
  """
  copyVersion(
    """Which version to copy, e.g. `3`"""
    number: VersionNumber!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """The new recipe’s name, e.g. `"Nonna’s lasagna"`"""
    title: RecipeTitle!
  ): Recipe!

  """
  Save a new recipe. Turns a confirmed import preview into a real recipe with its first version (`v1`). Returns the freshly created recipe.
  
  ```graphql
  createRecipe(input: {
    type: DISH
    category: MAIN
    title: "Grandma's lasagna"
    content: { dish: {
      ingredients: [{ name: "Flour", quantity: "250 g" }]
      steps: ["Layer the pasta", "Bake at 200°C"]
    } }
  }) {
    id
    versionToOpen { number }
  }
  ```
  """
  createRecipe(
    """The recipe to create — name, category, and its content"""
    input: CreateRecipeInput!
  ): Recipe!

  """
  Delete your account and everything the app holds on you: every recipe, every version, every attempt, your AI allowance and your entitlement. IRREVERSIBLE and immediate — there is no grace period and no way back. Export first if you want a copy (see exportData). Returns `true` once it is done.
  
  This does NOT cancel an App Store subscription: only the subscriber can, from the App Store settings. Deleting the account while a subscription runs leaves it billing.
  
  ```graphql
  deleteAccount
  ```
  """
  deleteAccount: Boolean!

  """
  Delete a recipe for good, along with every version and attempt on it. Returns `true` on success.
  
  ```graphql
  deleteRecipe(id: "9f1c-a3b2")
  ```
  """
  deleteRecipe(
    """Which recipe to delete"""
    id: RecipeId!
  ): Boolean!

  """
  Delete one version from a recipe, attempt included. The versions built on it are re-based onto the one it iterated on, and its number is never reused by a later iteration. Deleting the sole version deletes the recipe with it. Returns `true` on success.
  
  ```graphql
  deleteVersion(recipeId: "9f1c-a3b2", number: 2)
  ```
  """
  deleteVersion(
    """Which version to delete"""
    number: VersionNumber!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!
  ): Boolean!

  """
  Restore a backup. WARNING: this REPLACES everything you currently have with the contents of the JSON text (as produced by exportData). Returns a count of what was loaded, e.g. `12` recipes.
  
  ```graphql
  importData(payload: "{\"recipes\":[…],\"versions\":[…]}") {
    recipes
    versions
  }
  ```
  """
  importData(
    """The backup as JSON text, exactly as exportData produced it"""
    payload: String!
  ): ImportResult!

  """
  Save what happened when you cooked a version: its rating, optionally a photo. Overwritable — recording again on the same version simply updates it. Fast and does not call the AI. Use this when the cook asks for nothing more. To iterate on what you noticed, ask for a proposal instead (see requestProposal): your remarks then land on the version they produce, and this one is left untouched. Returns the version, now updated with its outcome.
  
  ```graphql
  recordAttempt(input: {
    recipeId: "9f1c-a3b2"
    versionNumber: 2
    rating: 4
  }) {
    number
    rating
  }
  ```
  """
  recordAttempt(
    """The attempt to record — which version, the rating, optionally a photo"""
    input: RecordAttemptInput!
  ): Version!

  """
  Write down a change you have ALREADY made: you cooked this recipe, changed something on the way (10 g of sugar instead of 20) and ate the result. The AI applies exactly that to the version you name — it invents nothing and improves nothing — and hands back the complete version to review. Nothing is saved yet: accepting it (see acceptProposal, with `cooked: true`) creates a version that has already been cooked, which is never on your to-cook list, unlike requestImprovement. Spends one iteration of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up.
  
  ```graphql
  requestChange(
    recipeId: "9f1c-a3b2"
    versionNumber: 2
    change: "j’ai mis 10 g de sucre au lieu de 20"
  ) {
    changeSummary
  }
  ```
  """
  requestChange(
    """
    What you changed, in your own words, e.g. `"j’ai mis 10 g de sucre au lieu de 20"`
    """
    change: Remarks!

    """The recipe you cooked, e.g. the id of `"Grandma’s lasagna"`"""
    recipeId: RecipeId!

    """The version you started from — the one on screen, e.g. `2`"""
    versionNumber: VersionNumber!
  ): Proposal!

  """
  Ask the AI for a next version answering something you want changed — no cook needed, just say what to improve. Nothing is saved yet: you get a proposal to review, and accepting it (see acceptProposal) creates the version, which lands on your to-cook list. Spends one iteration of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up.
  
  ```graphql
  requestImprovement(
    recipeId: "9f1c-a3b2"
    versionNumber: 2
    improvement: "A vegetarian version, for 6"
  ) {
    changeSummary
    rationale
  }
  ```
  """
  requestImprovement(
    """
    What you want changed, in your own words, e.g. `"A vegetarian version, for 6"` — this is what the proposal answers
    """
    improvement: Remarks!

    """The recipe to improve, e.g. the id of `"Grandma’s lasagna"`"""
    recipeId: RecipeId!

    """The version to improve on, e.g. `2`"""
    versionNumber: VersionNumber!
  ): Proposal!

  """
  Ask the AI for a suggested next version. It looks at the version you just cooked and at how the cook went — the rating and remarks you send here — and proposes one improvement. Nothing is saved yet, not even your rating: it is recorded on the version you cooked when you accept the proposal (see acceptProposal). Spends one iteration of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up.
  
  ```graphql
  requestProposal(
    recipeId: "9f1c-a3b2"
    versionNumber: 2
    rating: 3
    remarks: "Still a touch too sweet"
  ) {
    basedOn
    changeSummary
    rationale
  }
  ```
  """
  requestProposal(
    """How that cook turned out, `1` to `5`, e.g. `3`"""
    rating: Rating!

    """
    The recipe to get a suggestion for, e.g. the id of `"Grandma’s lasagna"`
    """
    recipeId: RecipeId!

    """
    What you noticed and want fixed, e.g. `"Still a touch too sweet"` — this is what the proposal answers
    """
    remarks: Remarks!

    """The version you just cooked and want to iterate on, e.g. `2`"""
    versionNumber: VersionNumber!
  ): Proposal!

  """
  Ask the AI to fold the tips you just typed into one version’s tips list — reworded, merged with the tips it already has, deduplicated. Nothing is saved: you get the complete list back to review, and accepting it goes through updateTips (no new version is ever created for tips). Spends one iteration of your monthly AI allowance (see quota) — `QUOTA_EXHAUSTED` once it is used up.
  
  ```graphql
  requestTips(
    recipeId: "9f1c-a3b2"
    versionNumber: 2
    tips: "servir avec du riz, se congèle bien"
  ) {
    tips
  }
  ```
  """
  requestTips(
    """The recipe whose tips to extend, e.g. the id of `"Grandma’s lasagna"`"""
    recipeId: RecipeId!

    """
    The tips to add, in your own words, e.g. `"servir avec du riz, se congèle bien"`
    """
    tips: Remarks!

    """The version whose tips to extend — the one on screen, e.g. `2`"""
    versionNumber: VersionNumber!
  ): TipsProposal!

  """
  Start this version’s cooking on the connected oven. What is sent is the oven profile the VERSION carries — never one passed in here: correcting a setting before cooking means editing the version, so what the oven does and what the notebook says can never disagree.
  
  Answers `OVEN_UNAVAILABLE` when the account has no oven, `NO_OVEN_PROFILE` when the version never bakes, `OVEN_OFFLINE` when the appliance does not answer, `REMOTE_CONTROL_DISABLED` until "remote operation" is switched on from the oven’s own screen, `OVEN_BUSY` when it is already cooking, `PROGRAM_UNSUPPORTED` when this oven has no such heating function, and `ASSISTED_NOT_STARTABLE` when the version bakes on one of the oven’s own programmes — the appliance reports those but refuses them as a command, so such a cooking starts from its own panel.
  
  ```graphql
  startOven(recipeId: "…", version: 2) {
    running { program temperature remaining }
  }
  ```
  """
  startOven(
    """Which recipe, e.g. the id of `"Quiche fine"`"""
    recipeId: RecipeId!

    """Which attempt in the chain to cook, e.g. `2`"""
    version: VersionNumber!
  ): Oven!

  """
  Hand over a transaction the App Store signed for you — after a purchase, after a restore, and on every launch while a subscription is running. The signature is verified against Apple’s root certificates and the purchase must carry your `appAccountToken`, so this is what grants Premium: nothing else does.
  
  Answers `INVALID_TRANSACTION` when the signature does not check out, and `TRANSACTION_NOT_YOURS` when the purchase belongs to another account.
  
  ```graphql
  syncEntitlement(signedTransaction: "eyJhbGciOi...") {
    plan
    expiresOn
  }
  ```
  """
  syncEntitlement(
    """
    The JWS representation of the StoreKit transaction, e.g. the `jwsRepresentation` of a verified entitlement
    """
    signedTransaction: String!
  ): Entitlement!

  """
  Correct one coffee version’s parameters — the roast date you read wrong, the grinder you forgot. Full replacement: no version is created, and the brewing steps and the outcome are left untouched (correcting what you logged is not iterating on the recipe). Every free-text value you send is also remembered for that field’s suggestions — see `coffeeVocabulary`. Returns the updated version.
  
  ```graphql
  updateCoffeeParameters(recipeId: "9f1c-a3b2", versionNumber: 1, parameters: {
    beans: { name: "Belleville — Guji", dose: "18 g" }
    extraction: { grind: "Niveau 12", time: "28 s", yield: "36 g" }
  }) { number restDays }
  ```
  """
  updateCoffeeParameters(
    """
    The complete new parameters — a block left out is cleared, and leaving `milk` out says the drink has none
    """
    parameters: CoffeeParametersInput!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """Which version to correct, e.g. `1`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Say which recipe one ingredient line IS — the pasta dough of a ravioli, a page of its own with its own versions and ratings. A correction in place: naming the dough you already used changes nothing about the plate you cooked, so **no version is created** and its rating still stands. Changing dough is another matter — that is an attempt, and it goes through a new version. **Send `component: null` to unlink**, which leaves a plain ingredient line behind. Returns the updated version.
  
  The linked recipe must be one of yours: anything else answers `NOT_FOUND`. A recipe cannot be its own ingredient (`SELF_REFERENCE`), and a coffee has no ingredient list to link from (`NOT_A_COOKED_RECIPE`).
  
  ```graphql
  updateComponent(
    recipeId: "9f1c-a3b2", versionNumber: 1, ingredient: 0, component: "3b7e-91cd"
  ) { number }
  ```
  """
  updateComponent(
    """The recipe this line is, or `null` to make it a plain ingredient again"""
    component: RecipeId

    """
    Which line of the ingredient list, counting from `0` in the order it is shown
    """
    ingredient: Int!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """Which version to annotate, e.g. `1`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Correct one cooked version’s shopping list — a quantity misread off a photo, a line the import split in two. Full replacement, in place: no version is created, the steps, the oven and the outcome are untouched, and the rating stays (correcting what the recipe always said is not iterating on it — a changed plate is a new version). Adding, deleting and reordering all go through this one list. A line that IS a recipe keeps its link as long as its name does not change (see updateComponent). Returns the updated version.
  
  Answers `NOT_A_COOKED_RECIPE` on a coffee, which has no shopping list — it has parameters.
  
  ```graphql
  updateIngredients(recipeId: "9f1c-a3b2", versionNumber: 1, ingredients: [
    { name: "Flour", quantity: "200 g" }
  ]) { number }
  ```
  """
  updateIngredients(
    """The complete new list, in order (send `[]` to clear it)"""
    ingredients: [IngredientInput!]!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """Which version to correct, e.g. `1`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Correct one cooked version’s oven settings — the temperature you read wrong, the duration the source never stated. Full replacement, in place: no version is created, and the ingredients, steps and outcome are untouched (correcting what the recipe always said is not iterating on it). **Send `oven: null` to say the dish never bakes**, which clears the profile outright rather than leaving a hollow one. Returns the updated version.
  
  Answers `NOT_A_COOKED_RECIPE` on a coffee, which has no oven — it has dials.
  
  ```graphql
  updateOvenProfile(recipeId: "9f1c-a3b2", versionNumber: 1, oven: {
    program: CONVECTION, temperature: 180, duration: 25
  }) { number }
  ```
  """
  updateOvenProfile(
    """The complete new oven settings, or `null` when the dish never bakes"""
    oven: OvenProfileInput

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """Which version to correct, e.g. `1`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Correct one version’s rating — the verdict you mistyped, or the one you never logged. Rewrites the rating in place: no version is created, and the photo and remarks of the attempt are left untouched (unlike recordAttempt, which replaces the whole outcome). A version that had never been cooked counts as cooked from here on, and leaves the list of versions still to test. Returns the updated version.
  
  ```graphql
  updateRating(recipeId: "9f1c-a3b2", versionNumber: 2, rating: 4) {
    number
    rating
  }
  ```
  """
  updateRating(
    """The corrected rating, 1 to 5"""
    rating: Rating!

    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """Which version’s rating to correct, e.g. `2`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Retouch a recipe: rename it, refile it under another course, mark it as a favourite, or any combination. Returns the updated recipe.
  
  ```graphql
  updateRecipe(id: "9f1c-a3b2", input: { title: "Nonna's lasagna", category: MAIN, favorite: true }) {
    id
    title
    category
    favorite
  }
  ```
  """
  updateRecipe(
    """Which recipe to update"""
    id: RecipeId!

    """What to change (leave a field out to change nothing)"""
    input: UpdateRecipeInput!
  ): Recipe!

  """
  Correct one cooked version’s method — a step the import split in two, an instruction read wrong. Full replacement, in place: no version is created, the ingredients, the oven and the outcome are untouched, and the rating stays. Each step may carry its Thermomix settings; they are read on a Thermomix version and ignored on a dish, which has no machine. Returns the updated version.
  
  Answers `NOT_A_COOKED_RECIPE` on a coffee, which has no steps — its dials say everything.
  
  ```graphql
  updateSteps(recipeId: "9f1c-a3b2", versionNumber: 1, steps: [
    { text: "Mix the onions", settings: { time: "5 s", speed: "5" } }
    { text: "Let it rest" }
  ]) { number }
  ```
  """
  updateSteps(
    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """The complete new method, in order (send `[]` to clear it)"""
    steps: [VersionStepInput!]!

    """Which version to correct, e.g. `1`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Replace one version’s cooking tips with this complete list — typically the accepted requestTips proposal, after your edits. Rewrites the tips in place: no new version is created, the content and outcome are left untouched. Returns the updated version.
  
  ```graphql
  updateTips(recipeId: "9f1c-a3b2", versionNumber: 2, tips: ["Serve over rice"]) {
    number
    tips
  }
  ```
  """
  updateTips(
    """Which recipe the version belongs to"""
    recipeId: RecipeId!

    """The complete new tips list (send `[]` to clear the section)"""
    tips: [Tip!]!

    """Which version’s tips to replace, e.g. `2`"""
    versionNumber: VersionNumber!
  ): Version!

  """
  Replace a recipe’s cautions with this complete list — what the banner atop its sheet shows before anything else, e.g. `"The whisk must go in from the very start"`. Recipe-level, so the cautions outlive every version; rewritten in place, no version is created. Returns the updated recipe.
  
  ```graphql
  updateWarnings(recipeId: "9f1c-a3b2", warnings: ["The whisk must go in from the very start"]) {
    id
    warnings
  }
  ```
  """
  updateWarnings(
    """Which recipe to pin the cautions on"""
    recipeId: RecipeId!

    """The complete new cautions list (send `[]` to clear the banner)"""
    warnings: [Warning!]!
  ): Recipe!
}

"""
The connected oven. Everything the recipe sheet needs before offering to start a cooking: whether the appliance answers, whether it is willing to be driven remotely, and what it is already doing.
"""
type Oven {
  """Whether the oven answered at all, e.g. `false` when it is unplugged"""
  reachable: Boolean!

  """
  Whether the oven accepts being started remotely, e.g. `false` until "remote operation" is switched on from its own screen. Starting a heating element is safety relevant, so the appliance gates it and no API call can bypass that.
  """
  remoteControlEnabled: Boolean!

  """The cooking under way, or `null` when the oven is idle"""
  running: OvenRun

  """
  What the dials are set to right now — the values a recipe can copy off the oven
  """
  settings: OvenSettings!
}

"""
The target temperature at the heart of the food, read by the oven’s probe, in °C from `30` to `100`, e.g. `63` for a pink leg of lamb. Absent on a plain timed cook.
"""
scalar OvenCoreTemperature

"""
A cooking time in whole minutes, from `1` to `720` (12 h), e.g. `25`. Absent on a dish whose probe is what decides it is done.
"""
scalar OvenDuration

"""
The oven settings a version bakes at: the heating function, the dial temperature, and how the cooking ends — a timer, a probe target, or both. Set by hand and owned by the version: plain values, never a reference to anything the oven might rename.
"""
type OvenProfile {
  """
  The oven’s own programme code, e.g. `"ASSIST_QUICHEANDTARTETHIN"`. Present if and only if `program` is `ASSISTED`, and what makes that cooking reproducible.
  """
  assisted: AssistedProgram

  """
  The probe target at the heart of the food, e.g. `63`. `null` when there is no probe.
  """
  core: OvenCoreTemperature

  """
  How long it bakes, in minutes, e.g. `25`. `null` when the probe decides.
  """
  duration: OvenDuration

  """The heating function, e.g. `CONVECTION`"""
  program: OvenProgram!

  """What the dial is set to, e.g. `180`"""
  temperature: OvenTemperature!
}

"""
The oven settings to save on this version. Send it only when the dish actually bakes, and omit it entirely otherwise — there is no "no oven" value. `duration` and `core` are each optional: a timed cook has a duration, a probe cook has a core target, a dish can have both.
"""
input OvenProfileInput {
  """
  The oven’s own programme code — required when `program` is `ASSISTED`, rejected otherwise. Copy it off `oven.settings`, never type it.
  """
  assisted: AssistedProgram

  """The probe target at the heart of the food, e.g. `63`"""
  core: OvenCoreTemperature

  """How long it bakes, e.g. `25`"""
  duration: OvenDuration

  """The heating function, e.g. `CONVECTION`"""
  program: OvenProgram!

  """What the dial is set to, e.g. `180`"""
  temperature: OvenTemperature!
}

"""
An oven heating function — what the dial selects, e.g. `CONVECTION`. Model-independent: a connected oven’s own codes are mapped behind the scenes, so a recipe survives a change of oven. Wider than any one model: a function your oven does not have can still be written down, and starting it answers `PROGRAM_UNSUPPORTED` rather than quietly cooking otherwise.
"""
enum OvenProgram {
  """High fan and little fat, e.g. for chips or wings"""
  AIR_FRY

  """
  One of the oven’s OWN programmes — "Quiche et tarte fine" and its kin. Not a heating function but a recipe the appliance runs, varying heat and humidity over time. The profile’s `assisted` field carries the code that names it, and reproducing the cooking means sending that code back: rewritten as a heating function it would cook something else without saying so.
  """
  ASSISTED

  """Bottom element only, e.g. to dry a base"""
  BOTTOM_HEAT

  """Fan-assisted hot air, e.g. for a quiche"""
  CONVECTION

  """Fan-assisted with added humidity, e.g. for a moist cake"""
  CONVECTION_HUMID

  """
  Top and bottom heat, no fan — what a recipe book means by "oven at 180°C"
  """
  CONVENTIONAL

  """Fan without heat"""
  DEFROST

  """Grill element, e.g. to brown a top"""
  GRILL

  """Bottom-biased heat, for a crisp base"""
  PIZZA

  """Steam only, e.g. for vegetables"""
  STEAM

  """Steam plus hot air, e.g. for bread"""
  STEAM_COMBI

  """Top element only, e.g. to finish a gratin"""
  TOP_HEAT

  """Grill plus fan, e.g. for a roast chicken"""
  TURBO_GRILL
}

"""
A cooking under way. Only how long is left: WHAT is cooking is `settings`, and answering it twice would be two answers to one question.
"""
type OvenRun {
  """
  Minutes left on the oven’s own timer, e.g. `12`. `null` on a probe cook, which ends on a temperature rather than a clock.
  """
  remaining: Int
}

"""
What the oven’s dials are set to RIGHT NOW — whatever it is doing, and whoever turned them, including you standing in front of it. This is what the app copies when you dial a cooking in on the oven and want the recipe to remember it.

Plain `Int`s, unlike a version’s branded oven dials: these are the appliance’s readings, not what a cook wrote down, and a stray one must not fail the query that only meant to display them.
"""
type OvenSettings {
  """
  The oven’s own programme code when one is selected, e.g. `"ASSIST_QUICHEANDTARTETHIN"`. Copy it onto the version alongside `program: ASSISTED` — it is what makes that cooking reproducible.
  """
  assisted: AssistedProgram

  """
  The probe target in °C, e.g. `63`. `null` unless a probe is plugged in — the appliance reports the field only then.
  """
  core: Int

  """
  The cooking time set, in minutes, e.g. `25`. `null` when no timer is set.
  """
  duration: Int

  """
  The heating function selected, e.g. `CONVECTION`. `null` when the oven is set to something this notebook has no word for — a cleaning cycle, or one of the model’s own combinations.
  """
  program: OvenProgram

  """The target temperature in °C, e.g. `180`"""
  temperature: Int
}

"""
An oven temperature in °C, as a whole number from `30` to `300`, e.g. `180`. What the dial is set to — not what the food reaches inside, which is an `OvenCoreTemperature`.
"""
scalar OvenTemperature

"""
What a cook is entitled to. The notebook itself is free and unlimited — the plan only decides how much AI comes with it.
"""
enum Plan {
  """
  The free plan — unlimited recipes, a monthly allowance of AI calls, no URL import
  """
  FREE

  """The paid subscription — unlimited AI calls and the URL import"""
  PREMIUM
}

"""
The AI’s suggestion for your next attempt, e.g. `"Less sugar, longer resting time"`. After an attempt, the AI reads your rating and remarks and proposes a tweaked version. It is just a proposal shown on screen — nothing is saved until you accept it (see acceptProposal).
"""
type Proposal {
  """
  The version this proposal iterates on (the one you just cooked), e.g. `2`. Sent straight back on accept so the new version records what it was based on.
  """
  basedOn: VersionNumber!

  """
  A one-line summary of what it changes, e.g. `"Less sugar, longer resting time"`
  """
  changeSummary: String!

  """
  The complete body of the suggested version (not just what changed) — a `DishContent`, a `ThermomixContent` or a `CoffeeContent` depending on the recipe type
  """
  content: VersionContent!

  """
  The AI’s reasoning — why it thinks this change will help, based on your last remarks, e.g. `"You noted it was too sweet, so cutting the sugar should balance it"`
  """
  rationale: String!

  """
  The complete tips list of the suggested version — the current tips carried over, any advice found in your remarks folded in, e.g. `["Serve over rice"]`
  """
  tips: [Tip!]!
}

"""
A complete next-version proposal to accept as an iteration, e.g. the AI’s `"Less sugar, longer resting time"` proposal. Send the FULL next version (an omitted ingredient/step wipes that list).
"""
input ProposalInput {
  """
  The version this iterates on — echo back the `basedOn` from the proposal, e.g. `2`
  """
  basedOn: VersionNumber!

  """
  A short human summary of what the next version changes, e.g. `"Less sugar"`
  """
  changeSummary: String!

  """
  The complete body of the next version — provide exactly one of `dish` or `thermomix`, matching the recipe type
  """
  content: VersionContentInput!

  """
  Whether you have ALREADY made this version — send `true` for a proposal that came from requestChange, where you changed the recipe at the stove and ate the result. It is then saved as a version that has been cooked (never on the to-cook list), the rating/remarks/photo below are recorded ON IT, and the version it iterates on (`basedOn`) is left untouched. Defaults to `false`: a suggestion nobody has cooked yet
  """
  cooked: Boolean

  """
  Base64 JPEG of that cook, e.g. `"/9j/4AAQSkZJRg…"` (optional; not yet stored)
  """
  photo: String

  """
  How the cook turned out, `1` to `5`, e.g. `3`. Recorded on the version you cooked — `basedOn`, or this new one when `cooked` is `true` (leave out when the proposal came from requestImprovement)
  """
  rating: Rating

  """The reasoning behind the change, e.g. `"You noted it was too sweet"`"""
  rationale: String!

  """
  What you noticed on that cook, e.g. `"Still a touch too sweet"` — the remarks this version answers (leave out when the proposal came from requestImprovement)
  """
  remarks: Remarks

  """
  The complete tips list of the next version — echo back the proposal’s `tips` (with any edits), e.g. `["Serve over rice"]`; send `[]` when it has none
  """
  tips: [Tip!]! = []
}

type Query {
  """
  The app’s "What’s new" list — one entry per release, newest first. Feeds the changelog screen. For example the `"1.2"` entry with notes `"Faster recipe imports"` and `"Fixed a crash when exporting"`, then the `"1.1"` entry, and so on.
  
  ```graphql
  changelog {
    version
    date
    notes
  }
  ```
  """
  changelog: [ChangelogEntry!]!

  """
  What to suggest in each free-text coffee field — the values you have already used, most recent first. One document, so it costs the same whether you have three coffees or three hundred.
  
  ```graphql
  { coffeeVocabulary { machines grinders waterKinds } }
  ```
  """
  coffeeVocabulary: CoffeeVocabulary!

  """
  What you are entitled to today, and the account token to start a purchase with. The app reads this before showing the subscription sheet.
  
  ```graphql
  entitlement {
    plan
    appAccountToken
    productId
    expiresOn
  }
  ```
  """
  entitlement: Entitlement!

  """
  Download all your data as one JSON text — a full backup of every recipe and version you own (e.g. your `"Grandma’s lasagna"` and all its attempts). Pair it with importData to move or restore your library.
  
  ```graphql
  query {
    exportData
  }
  ```
  """
  exportData: String!

  """
  The connected oven, or `null` when this account has none — which is how the app knows to show no oven controls at all. `null` is deliberately not an error: an account without an oven is not a failed request, it is a smaller app.
  
  Ask before offering to start a cooking: `reachable` tells you the appliance answered, `remoteControlEnabled` that it is willing to be driven, `settings` what its dials are set to — the values a recipe can copy off it — and `running` whether a cooking is already under way.
  
  ```graphql
  oven {
    reachable
    remoteControlEnabled
    settings { program temperature duration core }
    running { remaining }
  }
  ```
  """
  oven: Oven

  """
  Your AI allowance for the current month: the plan you are on, what you have spent, what is left and when it renews. Free plans get 3 imports and 5 iterations a month; Premium is unlimited and unlocks the URL import.
  
  ```graphql
  quota {
    plan
    imports { used limit remaining }
    iterations { used limit remaining }
    renewsOn
  }
  ```
  """
  quota: Quota!

  """
  Fetch one recipe by its id, with everything on it. Returns `null` if no such recipe exists.
  
  ```graphql
  recipe(id: "9f1c-a3b2") {
    title
    versionToOpen { number rating }
    versions { number change }
  }
  ```
  """
  recipe(
    """The id of the recipe to fetch, e.g. `"9f1c-a3b2"`"""
    id: RecipeId!
  ): Recipe

  """
  One page of your recipe library, loaded a few at a time for infinite scroll. You can narrow it (e.g. only `THERMOMIX` recipes, or only `DESSERT`) and choose the order. For example: the 20 most recently updated dishes, then pass the last id as `after` to load the next 20. The app’s cooking notebook asks for `[DISH, THERMOMIX]` and its coffee tab for `[COFFEE]`.
  
  ```graphql
  recipes(types: [THERMOMIX], sort: UPDATED_AT, order: DESC, limit: 20) {
    items { id title bestRating }
    hasMore
  }
  ```
  """
  recipes(
    """Cursor: return the page following this recipe id, e.g. `"9f1c-a3b2"`"""
    after: RecipeId

    """
    Facet: keep only this dish category, e.g. `DESSERT`. When set, the page is coerced to updatedAt desc — the sort/order args are ignored (ranking within one category is meaningless, and it keeps the composite-index surface bounded)
    """
    category: DishCategory

    """
    Facet: keep only the recipes you marked as favourites, e.g. `true`. Mixes every type — pair it with the category sort to read them course by course
    """
    favorite: Boolean

    """Maximum recipes returned in the page, e.g. `20`"""
    limit: Int = 20

    """
    Facet: keep only coffees brewed this way, e.g. `V60`. Like `category`, it coerces the page to updatedAt desc
    """
    method: BrewMethod

    """
    Sort direction, e.g. `DESC` (ignored for the category sort, which is fixed)
    """
    order: SortOrder = DESC

    """Field the page is ordered by, e.g. `UPDATED_AT`"""
    sort: RecipeSort = UPDATED_AT

    """
    Facet: keep only these recipe types, e.g. `[DISH, THERMOMIX]` for the cooking notebook. Leave out for every type.
    """
    types: [RecipeType!]
  ): Recipes!
}

"""
Your AI allowance for the current calendar month. Recipes and versions are never limited: only the calls to the AI are, and they reset on the 1st.
"""
type Quota {
  """Recipe imports analyzed by the AI this month (photos, text or URL)"""
  imports: QuotaCounter!

  """
  AI calls made on an existing recipe this month — a proposal, an improvement or a tips merge
  """
  iterations: QuotaCounter!

  """The plan in force, e.g. `FREE`"""
  plan: Plan!

  """
  When both meters go back to zero — the 1st of next month, e.g. `"2026-08-01T00:00:00.000Z"`
  """
  renewsOn: DateTime!
}

"""
One AI meter for the current month — what has been spent and what is left, e.g. `1` import used out of `3`
"""
type QuotaCounter {
  """
  How many the plan allows per month, e.g. `3` — `null` on an unlimited plan
  """
  limit: Int

  """
  How many are still available this month, e.g. `2` — `null` on an unlimited plan
  """
  remaining: Int

  """How many were spent this month, e.g. `1`"""
  used: Int!
}

"""
A rating out of 5, as a whole number from `1` (bad) to `5` (excellent), e.g. `4`. The best rating across a recipe’s attempts drives the version its recipe sheet opens on.
"""
scalar Rating

"""
A dish you are perfecting over time. A recipe is the whole experiment, not a single recipe card: it holds a chain of versions (v1, v2, v3 …), each one an attempt in the kitchen. Its state is derived from that chain — its best rating (bestRating) and the version to open from the home (versionToOpen). Think `"Grandma’s lasagna"` and every attempt you have made to nail it.
"""
type Recipe {
  """
  The best rating this recipe ever got, across all the attempts you have cooked, e.g. `5` (`1`–`5`). `null` if you have never tried any version yet.
  """
  bestRating: Rating

  """
  Which course it is, e.g. `DESSERT` for a tarte tatin. Set once at import and shared by every version; used to group the library. A coffee is always a `DRINK` — its own axis is `method`.
  """
  category: DishCategory!

  """When the recipe was first imported, e.g. `"2026-07-18T14:30:00.000Z"`"""
  createdAt: DateTime!

  """
  Whether you marked it as a favourite, e.g. `true` for the risotto you keep coming back to. Drives the library’s favourites lens (see the `favorite` argument on `recipes`).
  """
  favorite: Boolean!

  """Its unique identifier, e.g. `"9f1c…-a3b2"`"""
  id: RecipeId!

  """
  How it is brewed, e.g. `V60`. Set once at import and shared by every version; used to group the coffee tab. `null` on anything that is not a `COFFEE`.
  """
  method: BrewMethod

  """Its name, e.g. `"Grandma’s lasagna"`"""
  title: RecipeTitle!

  """
  How many of its versions are waiting to be cooked, e.g. `1` after accepting one proposal. `0` when the recipe owes no cook (see the `toTest` field on Version).
  """
  toTestCount: Int!

  """
  Whether it is a cooked dish (`DISH`), a Thermomix recipe (`THERMOMIX`) or a coffee (`COFFEE`)
  """
  type: RecipeType!

  """
  When you last worked on it — the date of the version it opens on (the best-rated one), e.g. `"2026-07-18T14:30:00.000Z"`. Renaming it or hearting it does not count as working on it. Drives library sort.
  """
  updatedAt: DateTime!

  """
  How many versions this recipe holds, e.g. `3` after `v1 → v2 → v3`. Deleting a version lowers it, but never renumbers the survivors.
  """
  versionCount: VersionNumber!

  """
  The version to show first when you open this recipe: your best-rated one (the most recent wins a tie), or — if you have never cooked any — the latest version. A version still waiting to be cooked never opens. Never `null`; a recipe always has at least its `v1`.
  """
  versionToOpen: Version!

  """The whole history, oldest first, e.g. `v1 → v2 → v3`"""
  versions: [Version!]!

  """
  The cautions you pinned on this recipe, shown as a banner atop its sheet before anything else, e.g. `"The whisk must go in from the very start"`. Recipe-level — a caution outlives every version. Empty list when it has none. Rewritable in place (see updateWarnings).
  """
  warnings: [Warning!]!
}

"""
The unique id of a recipe — a long random string like `"9f1c…-a3b2"` you pass around to fetch or change that one recipe (e.g. your `"Grandma’s lasagna"`)
"""
scalar RecipeId

"""Field the paginated recipe library is ordered by, e.g. `UPDATED_AT`"""
enum RecipeSort {
  """
  Dish course order (`STARTER → MAIN → DESSERT → SOUP → SAUCE → BAKING → DRINK`), most recently modified first within a course
  """
  CATEGORY

  """
  Brewing order (`ESPRESSO → … → COLD_BREW → OTHER`), most recently modified first within a method — the coffee tab’s own order
  """
  METHOD

  """
  Most recently worked on first (honours order) — a recipe is dated by the version it opens on, e.g. today’s lasagna cook on top
  """
  UPDATED_AT
}

"""A recipe’s name, e.g. `"Grandma’s lasagna"` (1 to 200 characters)"""
scalar RecipeTitle

"""
The kind of culinary experiment. Fixed at import, it decides how a version is displayed and how the AI is allowed to iterate on it.
"""
enum RecipeType {
  """
  A brewed coffee — each step also carries its extraction settings, e.g. `"18 g → 36 g / 93°C / 28 s"`. It always carries a `method` too, and lives in the app’s coffee tab rather than the cooking notebook.
  """
  COFFEE

  """A cooked dish — steps are plain text, e.g. `"Grandma’s lasagna"`"""
  DISH

  """
  A Thermomix recipe — each step also carries machine settings, e.g. `"10 min / 100°C / speed 2"`
  """
  THERMOMIX
}

"""
One slice of your recipe library — a single "page" of results, the way an app loads a few at a time as you scroll rather than everything at once.
"""
type Recipes {
  """
  Are there more recipes to load after this page? (`true` = keep scrolling, `false` = you have reached the end)
  """
  hasMore: Boolean!

  """
  The recipes on this page, e.g. `"Grandma’s lasagna"` then `"Tarte tatin"`
  """
  items: [Recipe!]!

  """
  How many recipes are on THIS page, e.g. `20` — not the size of the whole library, which is never counted (the list is meant to be scrolled, not totalled)
  """
  totalCount: Int!
}

"""
The result of cooking one version: which version you tried, how you rate it, and your remarks, e.g. `v2` rated `4`. Recorded once — a version’s outcome cannot be edited afterwards.
"""
input RecordAttemptInput {
  """
  Base64 JPEG of the result, e.g. `"/9j/4AAQSkZJRg…"` (optional; not yet stored)
  """
  photo: String

  """Your rating, `1` to `5`, e.g. `4`"""
  rating: Rating!

  """Which recipe you cooked, e.g. the id of `"Grandma’s lasagna"`"""
  recipeId: RecipeId!

  """
  Your remarks on how it turned out, e.g. `"Still a touch too sweet"` (optional)
  """
  remarks: Remarks

  """Which version of it you tried, e.g. `2`"""
  versionNumber: VersionNumber!
}

"""
Free notes you jot down about an attempt, e.g. `"Still too sweet, cut the sugar next time"` (up to 2000 characters)
"""
scalar Remarks

"""Sort direction, e.g. `DESC`"""
enum SortOrder {
  """Ascending (oldest / lowest first), e.g. `v1` first"""
  ASC

  """Descending (newest / highest first), e.g. `v3` first"""
  DESC
}

"""
One instruction in the method, e.g. `"Fold in the egg whites"` (1 to 300 characters)
"""
scalar StepText

"""
The body of a Thermomix version: its ingredient list and its steps, each carrying its own Thermomix settings.
"""
type ThermomixContent {
  """The full ingredient list, in order (empty list when it has none)"""
  ingredients: [Ingredient!]!

  """
  The oven settings this version bakes at — a dough kneaded on the machine still finishes in the oven. `null` when it never does.
  """
  oven: OvenProfile

  """The method, each step carrying its own Thermomix settings"""
  steps: [ThermomixStep!]!
}

"""
The body of a Thermomix version: its ingredient list and its steps, each carrying its own Thermomix settings.
"""
input ThermomixContentInput {
  """The ingredient list, in order (send `[]` when the recipe has none)"""
  ingredients: [IngredientInput!]!

  """
  The oven settings this version bakes at — a dough kneaded on the machine still finishes in the oven. Omit it when it never does.
  """
  oven: OvenProfileInput

  """The method, each step carrying its own Thermomix settings"""
  steps: [ThermomixStepInput!]!
}

"""
The Thermomix machine settings that go with one step (only for Thermomix recipes). Every field is optional — a step can set just a speed, or a full time + temperature + speed combo, e.g. `"10 min / 100°C / speed 2"`.
"""
type ThermomixSettings {
  """
  Whether the blades spin in reverse (gentle mixing) — `true`/`false`, `null` if not set
  """
  reverse: Boolean

  """
  The blade speed, e.g. `"2"`, `"kneading"`, `"turbo"` (`null` if not set)
  """
  speed: ThermomixSpeed

  """
  The cooking temperature, e.g. `"100°C"` or `"Varoma"` (`null` if not set)
  """
  temperature: ThermomixTemperature

  """
  How long the step runs, e.g. `"10 min"` or `"30 s"` (`null` if not set)
  """
  time: ThermomixTime
}

"""
The Thermomix settings to attach to one step, e.g. `"10 min / 100°C / speed 2"`. Every field is optional.
"""
input ThermomixSettingsInput {
  """Reverse (gentle mixing) on or off, e.g. `true`"""
  reverse: Boolean

  """Blade speed, e.g. `"2"` or `"turbo"`"""
  speed: ThermomixSpeed

  """Temperature, e.g. `"100°C"`"""
  temperature: ThermomixTemperature

  """Duration, e.g. `"10 min"`"""
  time: ThermomixTime
}

"""
The blade speed of a Thermomix step, e.g. `"5"`, `"pétrin"` (kneading) or `"turbo"`
"""
scalar ThermomixSpeed

"""
One Thermomix step: its instruction plus the machine settings that go with it. A plain step (no machine settings) carries an empty settings object.
"""
type ThermomixStep {
  """
  The Thermomix settings for this step, e.g. `"10 min / 100°C / speed 2"` (every field left out = a plain step)
  """
  settings: ThermomixSettings!

  """The step instruction, e.g. `"Mix the onions"`"""
  text: StepText!
}

"""
One Thermomix step to save: its instruction plus the machine settings that go with it. Send `settings: {}` for a plain step (no machine settings).
"""
input ThermomixStepInput {
  """
  Its Thermomix settings, e.g. `"10 min / 100°C / speed 2"` (send `{}` for a plain step)
  """
  settings: ThermomixSettingsInput!

  """The step instruction, e.g. `"Mix the onions"`"""
  text: StepText!
}

"""
The temperature of a Thermomix step, e.g. `"100°C"` or `"Varoma"` (its steam setting)
"""
scalar ThermomixTemperature

"""
How long a Thermomix step runs, written as you would read it, e.g. `"3 min"` or `"30 s"`
"""
scalar ThermomixTime

"""
One cooking tip — serving, storage or technique advice that is neither an ingredient nor a step, e.g. `"Serve over rice"` (1 to 300 characters)
"""
scalar Tip

"""
The AI’s reworded, merged tips list for one version — what you asked to add, folded into the tips it already had. Just a proposal shown on screen: nothing is saved until you send it back through updateTips.
"""
type TipsProposal {
  """
  The complete new tips list, e.g. `["Serve over rice", "Freezes well"]` — every current tip kept, the requested advice reworded and deduplicated
  """
  tips: [Tip!]!
}

"""
What you can retouch on a recipe: its name, its course or its brew method, and whether it is a favourite. Send only what you want to change — anything you leave out stays as it was. Its type is fixed for good.
"""
input UpdateRecipeInput {
  """
  The new course, e.g. `DRINK` for a recipe the import filed as `MAIN` (leave out to keep the current one). Ignored on a `COFFEE` — refiling one means changing its `method`.
  """
  category: DishCategory

  """
  `true` marks it as a favourite, `false` un-marks it, e.g. `true` for the risotto you keep coming back to (leave out to keep it as it is)
  """
  favorite: Boolean

  """
  The new brew method, e.g. `CHEMEX` for a coffee the import filed as `V60` (leave out to keep the current one). Rejected on a recipe that is not a `COFFEE`.
  """
  method: BrewMethod

  """
  The new name, e.g. `"Nonna’s lasagna"` (leave out to keep the current one)
  """
  title: RecipeTitle
}

"""
Identifies one signed-in cook, e.g. `"user-7f3a"`. Every recipe belongs to exactly one of these.
"""
scalar UserId

"""
One version of a recipe — and, at the same time, one attempt (a real cook in the kitchen). Two sides to it: the CONTENT (its ingredients and steps, frozen the moment the version is created) and the OUTCOME (its rating and remarks, filled in once you have actually cooked it). Versions form a chain: `v1 → v2 → v3` … Each new version builds on the one before, so you can see what changed and whether it made the dish better.
"""
type Version {
  """
  The version this one iterates on — the attempt it was built from, e.g. `2` for a `v3` proposed after cooking `v2`. `null` on the original `v1`, which builds on nothing.
  """
  basedOn: VersionNumber

  """
  A short summary of what this version changes versus the previous one, e.g. `"Baked at 180°C instead of 200°C"`. A dish or Thermomix recipe may change several things at once. `null` on the original `v1`, which changes nothing.
  """
  change: String

  """
  This version’s body — its ingredients and steps. A `DishContent` for a cooked dish (plain-text steps), a `ThermomixContent` for a Thermomix recipe (each step carrying its machine settings), a `CoffeeContent` for a coffee (each step carrying its extraction settings).
  """
  content: VersionContent!

  """
  When this version was created (not when it was cooked — see executedAt), e.g. `"2026-07-18T14:30:00.000Z"`
  """
  createdAt: DateTime!

  """
  The day you actually cooked this version, e.g. `"2026-07-18T14:30:00.000Z"`. `null` means it is still a planned attempt (a to-do you have lined up but not tried yet).
  """
  executedAt: DateTime

  """
  Its rank in the chain — `1` is the original import, `2` the first tweak, and so on
  """
  number: VersionNumber!

  """
  A short label about its origin, e.g. `"Marmiton"` (the site it was imported from), or `null` if none
  """
  originDetail: String

  """
  Where this version came from: the import, an AI suggestion, or written by hand
  """
  originKind: VersionOriginKind!

  """
  A link to the photo of the result, e.g. `"https://…/lasagna.jpg"` (always `null` for now — photos aren’t stored yet)
  """
  photoUrl: String

  """
  Your rating of this attempt, from `1` (bad) to `5` (excellent). `null` until you have cooked it. The recipe’s best rating across its versions drives what it displays (see bestRating).
  """
  rating: Rating

  """
  Which recipe this version belongs to, e.g. the id of `"Grandma’s lasagna"`
  """
  recipeId: RecipeId!

  """
  Your free notes on how it turned out, e.g. `"Still a touch too sweet, but the texture is spot on"`. `null` until you have cooked it.
  """
  remarks: Remarks

  """
  How many full days the beans rested between the roast and this version, e.g. `14`. Counted to the version’s creation, so it is frozen and stays comparable from one attempt to the next. `null` on anything that is not a coffee, on a coffee with no roast date, and on one whose roast date is in the future.
  """
  restDays: Int

  """
  This version’s cooking tips — serving, storage or technique advice, e.g. `"Serve over rice"`. Empty list when it has none. Rewritable in place (see updateTips) — refining the advice never creates a version.
  """
  tips: [Tip!]!

  """
  Whether this version is on your to-cook list, e.g. `true` for the version you just got out of acceptProposal. Every accepted proposal puts a version there — it has not been made yet, whatever asked for it; cooking it (a rating, a photo, remarks) takes it off.
  """
  toTest: Boolean!

  """
  The quick yes/no of the field above: `true` once you have cooked and rated it, `false` while it is still waiting to be tried
  """
  tried: Boolean!

  """
  When this version was last edited — its attempt re-recorded, its tips or its coffee parameters corrected. Same as createdAt until something is changed on it, e.g. `"2026-07-20T09:05:00.000Z"`
  """
  updatedAt: DateTime!

  """
  The reason behind that change, e.g. `"The top was burning at 200°C"`. `null` when not given.
  """
  why: String
}

"""
The body of a version, which depends on the recipe type: a `DishContent` for a cooked dish, a `ThermomixContent` for a Thermomix recipe, a `CoffeeContent` for a coffee.
"""
union VersionContent = CoffeeContent | DishContent | ThermomixContent

"""
The body of a version, tagged by recipe type: provide EXACTLY ONE of `dish` (a cooked dish), `thermomix` (a Thermomix recipe) or `coffee` (a brewed coffee).
"""
input VersionContentInput @oneOf {
  """A coffee body"""
  coffee: CoffeeContentInput

  """A cooked-dish body"""
  dish: DishContentInput

  """A Thermomix body"""
  thermomix: ThermomixContentInput
}

"""
Which attempt in the chain — a whole number starting at `1` (`1` = the original, `2` = the first tweak…)
"""
scalar VersionNumber

"""
Where a version came from — how this entry in the lineage was born, e.g. `IMPORT`
"""
enum VersionOriginKind {
  """
  An iteration the AI proposed from the previous attempt and the cook accepted, e.g. `"Less sugar, longer resting time"`
  """
  AI_PROPOSAL

  """
  The original `v1`, created when the recipe was imported, e.g. from `"Marmiton"`
  """
  IMPORT

  """
  A version the cook wrote by hand, without the AI, e.g. `"Swapped in honey"`
  """
  MANUAL
}

"""
One step to write onto an existing version: its instruction, plus the machine settings that go with it. `settings` is read on a Thermomix version and IGNORED on a dish, which has no machine — one shape serves both, so a plain recipe never has to send an empty object.
"""
input VersionStepInput {
  """
  Its Thermomix settings, e.g. `"10 min / 100°C / speed 2"` — omit it for a plain step
  """
  settings: ThermomixSettingsInput

  """The step instruction, e.g. `"Mix the onions"`"""
  text: StepText!
}

"""
One recipe-level caution the cook pinned so it is read before cooking starts, e.g. `"The whisk must go in from the very start"` (1 to 300 characters)
"""
scalar Warning